<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SlowForm - Pagamento com Cartão</title>
        <link rel="stylesheet" href="pagamento-cartao.css">
    </head>
    <body>
        <nav>
            <div class="logo">Slow<span>Form</span></div>
        </nav>

        <div class="pagamento-container">
            <h1>Pagamento com Cartão</h1>

            <form method="get" action="index2.html">
                <div class="form-group">
                    <label for="titular">Nome do Titular do Cartão</label>
                    <input type="text" id="titular" name="titular" placeholder="Ex: João Silva" required>
                </div>

                <div class="form-group">
                    <label for="numero">Número do Cartão</label>
                    <input type="text" id="numero" name="numero" placeholder="0000 0000 0000 0000" maxlength="19" required>
                </div>

                <div class="form-row">
                    <div class="form-group-small">
                        <label for="validade">Validade (MM/AA)</label>
                        <input type="text" id="validade" name="validade" placeholder="MM/AA" maxlength="5" required>
                    </div>
                    <div class="form-group-small">
                        <label for="cvv">CVV</label>
                        <input type="text" id="cvv" name="cvv" placeholder="000" maxlength="3" required>
                    </div>
                </div>

                <div class="cartao-info">
                    <p>Seus dados de pagamento são seguros e criptografados.</p>
                </div>

                <div class="botoes">
                    <button type="submit" class="btn-pagar">Pagar Agora</button>
                    <button type="button" class="btn-voltar" onclick="history.back();">Voltar</button>
                </div>
            </form>
        </div>
    </body>
</html>
