<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SlowForm - Pagamento com Boleto</title>
        <link rel="stylesheet" href="pagamento-boleto.css">
    </head>
    <body>
        <nav>
            <div class="logo">Slow<span>Form</span></div>
        </nav>

        <div class="pagamento-container">
            <h1>Pagamento com Boleto</h1>

            <form method="get" action="index2.html">
                <div class="form-group">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: João Silva" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="seu.email@example.com" required>
                </div>

                <div class="form-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="boleto-info">
                    <h3>Código de Barras</h3>
                    <div class="boleto-numero">12345.67890 12345.678901 12345.678901 1 12345678901234</div>
                    <p><strong>Vencimento:</strong> 15/05/2026</p>
                    <p><strong>Valor:</strong> R$ 99,00</p>
                    <p style="margin-top: 15px;">Copie o código de barras e pague no seu banco ou em uma casa lotérica.</p>
                </div>

                <div class="botoes">
                    <button type="submit" class="btn-confirmar">Confirmar Pagamento</button>
                    <button type="button" class="btn-voltar" onclick="history.back();">Voltar</button>
                </div>
            </form>
        </div>
    </body>
</html>
